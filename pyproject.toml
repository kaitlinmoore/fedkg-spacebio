[project]
name = "fedkg-spacebio"
version = "0.0.1"
description = "Federated KG agent for NASA OSDR space biology data: harmonize, federate, govern, ground."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kaitlin Moore" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pydantic>=2",
    "pyyaml",
    "requests",
    # NVIDIA FLARE: Job Recipe API + FL simulator. Pinned to the 2.9 line (see DECISIONS Q-8:
    # 2.9 removed the file-based pipe that 2.8.x still has).
    "nvflare[sklearn]>=2.9,<2.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedkg_spacebio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
